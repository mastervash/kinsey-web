[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "maigret-web"
version = "0.6.6"
description = "Web-first OSINT search for people and usernames across thousands of sites."
authors = ["Soxoj <soxoj@protonmail.com>", "mastervash"]
readme = "README.md"
packages = [{ include = "maigret" }]
license = "MIT License"
homepage = "https://github.com/mastervash/maigret-web"

repository = "https://github.com/mastervash/maigret-web"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English"
]

[tool.poetry.urls]
"Upstream" = "https://github.com/soxoj/maigret"

[tool.poetry.dependencies]
# poetry install
# Install only production dependencies:
# poetry install --without dev
# Install with dev dependencies:
# poetry install --with dev
python = "^3.10"
aiodns = ">=3,<5"
aiohttp = "^3.12.14"
aiohttp-socks = ">=0.10.1,<0.13.0"
certifi = ">=2025.6.15,<2027.0.0"
html5lib = "^1.1"
Jinja2 = "^3.1.6"
lxml = ">=6.0.2,<7.0"
MarkupSafe = "^3.0.2"
pycountry = ">=24.6.1,<27.0.0"
PySocks = "^1.7.1"
python-dateutil = ">=2.8.1"
requests = "^2.32.4"
socid-extractor = ">=0.1.1,<0.2.0"
soupsieve = "^2.6"
typing-extensions = "^4.14.1"
yarl = "^1.20.1"
platformdirs = "^4.3.8"
curl-cffi = ">=0.14,<1.0"
fastapi = ">=0.110"
uvicorn = {extras = ["standard"], version = ">=0.29"}



[tool.poetry.group.dev.dependencies]
# How to add a new dev dependency: poetry add black --group dev
# Install dev dependencies with: poetry install --with dev
flake8 = "^7.1.1"
pytest = ">=8.3.4,<10.0.0"
pytest-asyncio = "^1.0.0"
pytest-cov = ">=6,<8"
pytest-httpserver = "^1.0.0"
pytest-rerunfailures = ">=15.1,<17.0"
httpx = ">=0.27"
mypy = ">=1.14.1,<3.0.0"
coverage = "^7.9.2"
black = ">=25.1,<27.0"

[tool.poetry.scripts]
maigret-web = "maigret.server.app:main"
